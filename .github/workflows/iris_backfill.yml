name: IRIS backfill 2026
on:
  push:
    branches: [claude/iris-backfill]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests beautifulsoup4 urllib3 pypdf olefile
      - run: mkdir -p out && (python iris_backfill/run.py > out/log.txt 2>&1 || true)
      - name: Encrypt results and publish to a scratch branch
        run: |
          cd out
          tar czf data.tgz iris.json log.txt 2>/dev/null || tar czf data.tgz log.txt
          openssl rand -hex 32 > k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in data.tgz -out data.enc -pass file:k
          openssl pkeyutl -encrypt -pubin -inkey ../iris_backfill/pub.pem -in k -out k.enc
          rm -f k data.tgz iris.json log.txt
          git init -q -b out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "encrypted iris output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out:claude/iris-out
