name: Update Tender Dashboard

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 수동 실행과 정기 실행이 겹치면 앞 실행이 끝날 때까지 기다렸다가 차례로 실행합니다.
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 urllib3 pypdf olefile

      - name: Run Scraper Script
        run: python update_data.py
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          MSIT_API_KEY: ${{ secrets.MSIT_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Auto-update dashboard via API and Crawler"
          # 그 사이 다른 커밋이 올라왔으면 위에 다시 얹고(data.json은 이번 결과 우선) 올립니다.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          done
          exit 1
